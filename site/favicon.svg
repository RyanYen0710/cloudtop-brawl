<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cloudtop Brawl logo: a floating sky island at sunset with the glowing ultimate orb above it -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b6e"/>
      <stop offset="0.55" stop-color="#6a3fd1"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.45" stop-color="#ffd35c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="0.38" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#7af7ff"/>
      <stop offset="0.75" stop-color="#ff4dd8"/>
      <stop offset="1" stop-color="#7a2bff"/>
    </radialGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ef05a"/>
      <stop offset="1" stop-color="#2fb24a"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b0704a"/>
      <stop offset="0.5" stop-color="#7a4a8c"/>
      <stop offset="1" stop-color="#3d2a6b"/>
    </linearGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff4ff"/>
      <stop offset="1" stop-color="#bff4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="32" cy="30" r="22" fill="url(#sun)"/>
  <!-- distant little islands -->
  <path d="M5 25 h8 l-3 5 h-2 z" fill="#4b2f86" opacity="0.8"/>
  <path d="M51 21 h9 l-4 6 h-2 z" fill="#4b2f86" opacity="0.8"/>
  <!-- the main floating island -->
  <path d="M8 37 C16 34 48 34 56 37 L52 42 L46 44 L43 49 L37 50 L33 58 L28 51 L22 49 L18 44 L12 42 Z" fill="url(#rock)" stroke="#1a1238" stroke-width="2" stroke-linejoin="round"/>
  <path d="M17 43 L24 45 M40 45 L47 43 M29 50 L34 50" stroke="#ffb27a" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M46 41 L47 56" stroke="url(#fall)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M7 37 C14 31 50 31 57 37 C50 41 14 41 7 37 Z" fill="url(#grass)" stroke="#1a1238" stroke-width="2" stroke-linejoin="round"/>
  <!-- bushes and a little temple pillar -->
  <circle cx="14.5" cy="34" r="3.2" fill="#3fd06a" stroke="#1a1238" stroke-width="1.5"/>
  <circle cx="18.5" cy="33" r="2.6" fill="#5ee07a" stroke="#1a1238" stroke-width="1.5"/>
  <rect x="49" y="28" width="3" height="7" rx="0.6" fill="#ffe7c2" stroke="#1a1238" stroke-width="1.4"/>
  <!-- the glowing ultimate orb -->
  <circle cx="35" cy="19" r="10" fill="#ffd35c" opacity="0.35"/>
  <circle cx="35" cy="19" r="7" fill="url(#orb)" stroke="#ffffff" stroke-width="1.6"/>
  <path d="M30 18 a5.5 5.5 0 0 1 4 -4.5" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- clouds under the island -->
  <path d="M4 60 c0-5 7-6 9-3 c2-5 10-4 10 1 c3-2 7 0 6 2 z" fill="#ffffff" opacity="0.9"/>
  <path d="M38 61 c1-4 6-5 8-2 c2-4 9-3 9 1 c3-1 6 1 5 1 z" fill="#ffe7f6" opacity="0.85"/>
</svg>
