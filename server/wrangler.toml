name = "cloudtop-brawl-server"
main = "src/worker.js"
compatibility_date = "2025-09-01"
account_id = "0f16b6fbadf973e8d7dc7cb27b468db2"

# Public settings only. The owner email is a hidden Cloudflare secret (OWNER_EMAILS), never in this file.
[vars]
FIREBASE_PROJECT_ID = "cloudtop-brawl"
ALLOWED_ORIGINS = "https://cloudtop-brawl.com,https://www.cloudtop-brawl.com,https://cloudtop-brawl.pages.dev,https://cloudtop-brawl.vercel.app"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]
